name: Improve mobile location cards
on:
  push:
    paths:
      - '.github/workflows/improve-mobile-location-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add compact mobile location cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* mobile-location-cards-v2 */'
          if marker not in s:
              css=r'''/* mobile-location-cards-v2 */
@media(max-width:600px){
  .places{padding:56px 0!important}
  .places .section-head{margin-bottom:22px!important}
  .place-grid{gap:12px!important}
  .place-card.oslo,.place-card.bergen,.place-card.baerum,.place-card.asker,.place-card.hamar{
    grid-column:span 12!important;
    min-height:0!important;
    height:auto!important;
    padding:18px 18px!important;
    border-radius:22px!important;
    display:grid!important;
    grid-template-columns:1fr auto!important;
    grid-template-rows:auto auto!important;
    column-gap:14px!important;
    row-gap:8px!important;
    align-items:center!important;
    position:relative!important;
    overflow:hidden!important;
  }
  .place-card>div:first-child{grid-column:1;grid-row:1;margin:0!important}
  .place-card .place-kicker{font-size:9px!important;letter-spacing:.14em!important;margin:0 0 2px!important;opacity:.72}
  .place-card h3{font-size:30px!important;line-height:1!important;margin:0!important;letter-spacing:-.035em!important}
  .place-card .place-bottom{grid-column:1 / -1!important;grid-row:2!important;display:grid!important;grid-template-columns:1fr auto!important;gap:12px!important;align-items:center!important;margin:0!important}
  .place-card .place-bottom p{margin:0!important;font-size:13px!important;line-height:1.35!important;color:#514b59!important;padding-right:58px!important}
  .place-card .place-arrow{position:absolute!important;right:16px!important;top:50%!important;transform:translateY(-50%)!important;width:42px!important;height:42px!important;font-size:18px!important;box-shadow:0 6px 18px rgba(35,22,47,.08)!important}
  .place-card:before{position:absolute;right:70px;top:18px;background:rgba(255,255,255,.68);border:1px solid rgba(25,20,31,.06);padding:5px 8px;border-radius:999px;font-size:9px;font-weight:850;letter-spacing:.03em;color:#514b59}
  .place-card.oslo:before{content:'4 steder'}
  .place-card.bergen:before{content:'Bergen vest'}
  .place-card.baerum:before{content:'2 steder'}
  .place-card.asker:before{content:'Asker'}
  .place-card.hamar:before{content:'Hamar'}
  .place-card:active{transform:scale(.985)}
}
'''
              s=s.replace('</style>',css+'</style>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make mobile location cards compact and scannable"
          git push