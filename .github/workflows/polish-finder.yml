name: Polish offer finder
on:
  push:
    paths:
      - '.github/workflows/polish-finder.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve finder UI and behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css='''.finder{background:white;border-radius:32px;padding:30px;box-shadow:var(--shadow);border:1px solid rgba(25,20,31,.06)}\n.finder-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.finder-head h2{margin:0;font-size:31px;letter-spacing:-.04em}.finder-head p{margin:0;color:var(--muted)}\n.finder-grid{display:grid;grid-template-columns:1.3fr 1.1fr .8fr auto;gap:12px}\n.field{background:#faf8fc;border:1px solid var(--line);border-radius:17px;padding:10px 14px}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.field select{width:100%;background:transparent;border:0;outline:0;padding:3px 0 0;font-weight:750;color:var(--ink)}\n.find-btn{border:0;background:var(--ink);color:white;border-radius:17px;padding:0 22px;font-weight:850;cursor:pointer}\n.result{display:none;margin-top:18px;padding:17px 20px;border-radius:18px;background:var(--purple-soft);color:var(--purple-dark);font-weight:700}'''
          new_css='''.finder{background:white;border-radius:32px;padding:36px;box-shadow:var(--shadow);border:1px solid rgba(25,20,31,.06)}\n.finder-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}.finder-head h2{margin:0;font-size:34px;letter-spacing:-.04em}.finder-head p{margin:4px 0 0;color:var(--muted)}\n.finder-grid{display:grid;grid-template-columns:1.25fr 1fr .75fr auto;gap:14px;align-items:stretch}\n.field{background:#fff;border:2px solid #ebe5ef;border-radius:20px;padding:12px 16px;transition:.18s}.field:focus-within{border-color:var(--purple);box-shadow:0 0 0 4px rgba(108,43,184,.08)}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:850;margin-bottom:2px}.field select{width:100%;background:transparent;border:0;outline:0;padding:4px 0 0;font-weight:800;color:var(--ink);cursor:pointer}\n.find-btn{border:0;background:var(--purple);color:white;border-radius:20px;padding:0 26px;font-weight:850;cursor:pointer;box-shadow:0 10px 26px rgba(108,43,184,.2);transition:.18s}.find-btn:hover{transform:translateY(-2px)}\n.result{display:none;margin-top:18px;border:1px solid #dfc9f5;border-radius:22px;background:linear-gradient(135deg,#f5edff,#fbf8ff);overflow:hidden}.result-copy{padding:18px 20px}.result-copy small{display:block;color:var(--muted);font-weight:700;margin-bottom:3px}.result-copy strong{color:var(--purple-dark);font-size:17px}.result-actions{display:flex;gap:10px;padding:0 20px 20px}.result-link{display:inline-flex;align-items:center;justify-content:center;background:var(--purple);color:#fff;padding:12px 17px;border-radius:999px;font-weight:850}.result-secondary{display:inline-flex;align-items:center;padding:12px 15px;font-weight:800;color:var(--purple-dark)}'''
          if old_css not in s: raise SystemExit('Finder CSS pattern not found')
          s=s.replace(old_css,new_css)
          old_js='''function findOffer(){\n const a=document.getElementById('activity').value,p=document.getElementById('place').value,age=document.getElementById('age').value,r=document.getElementById('result');\n r.innerHTML=`Forslag for <strong>${a}</strong> i <strong>${p}</strong> · ${age}: Vi finner aktuelle undervisningssteder, lærere og dager her. <span style="float:right">Se muligheter →</span>`;r.style.display='block';\n}'''
          new_js='''function findOffer(){\n const a=document.getElementById('activity').value,p=document.getElementById('place').value,age=document.getElementById('age').value,r=document.getElementById('result');\n const q=new URLSearchParams({aktivitet:a,sted:p,alder:age}).toString();\n r.innerHTML=`<div class="result-copy"><small>Vi har et godt utgangspunkt</small><strong>${a} · ${p} · ${age}</strong><div style="margin-top:5px;color:var(--muted);font-weight:650">Send interessen på under to minutter. Vi matcher dere med aktuelt undervisningssted, lærer og tidspunkt.</div></div><div class="result-actions"><a class="result-link" href="/pamelding.html?${q}">Gå til påmelding →</a><a class="result-secondary" href="#tilbud">Se alle tilbud</a></div>`;\n r.style.display='block';r.scrollIntoView({behavior:'smooth',block:'nearest'});\n}'''
          if old_js not in s: raise SystemExit('Finder JS pattern not found')
          s=s.replace(old_js,new_js)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Kulturforalle Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Polish offer finder and fix CTA" || exit 0
          git push
