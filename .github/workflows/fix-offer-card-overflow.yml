name: Fix offer card title overflow
on:
  push:
    paths:
      - '.github/workflows/fix-offer-card-overflow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add responsive title sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-nav.js')
          s=p.read_text()
          old=".visual-offer-card h3{font-size:25px!important;margin:0 0 7px!important}"
          new=".visual-offer-card h3{font-size:clamp(20px,2.15vw,25px)!important;line-height:1.05!important;margin:0 0 7px!important;overflow-wrap:anywhere}.visual-offer-card h3.long-title{font-size:clamp(18px,1.75vw,22px)!important}"
          s=s.replace(old,new)
          old2="<h3>'+name+'</h3>"
          new2="<h3 class=\"'+(name.length>16?'long-title':'')+'\">'+name+'</h3>"
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-nav.js
          git diff --cached --quiet || git commit -m "Fix responsive offer card titles"
          git push